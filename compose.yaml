services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - jejak_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .runtime/postgres.env
    ports:
      - "127.0.0.1:${JEJAK_DB_PORT:-55432}:5432"
    volumes:
      - jejak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jejak_bootstrap -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  jejak_redis:
  jejak_postgres:
